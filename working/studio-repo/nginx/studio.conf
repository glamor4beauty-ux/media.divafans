server {
    server_name media.divafans.club;
    root /opt/owncast/webroot;

    location = /        { return 301 /studio/; }
    location = /studio  { return 301 /studio/; }

    location /studio/ { try_files $uri $uri/ =404; }

    location = /studio/api/check.php {
        internal;
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location ~ ^/studio/.*\.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Owncast embeds — only load for a logged-in session
    location /embed/ {
        auth_request /studio/api/check.php;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Everything else is Owncast (hls, api, websocket chat, admin, assets)
    # --- MediaMTX WHIP browser publish ---
    location = /golive { return 302 /studio/golive.html; }
    location = /live/whip {
        auth_request /studio/api/check.php;
        proxy_pass http://127.0.0.1:8889/live/whip;
        proxy_set_header Host $host;
    }
    location /live/ {
        proxy_pass http://127.0.0.1:8889/live/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # clean performer + admin URLs (file name hidden)
    location = /live  { try_files /studio/golive.html =404; }
    location = /go    { try_files /studio/golive.html =404; }
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/media.divafans.club/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/media.divafans.club/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = media.divafans.club) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name media.divafans.club;
    return 404; # managed by Certbot










}
