# === Bunny Storage Zone details (Storage > your zone > FTP & API Access) ===
# Storage hostname for your zone's region. Examples:
#   storage.bunnycdn.com (default/DE), ny.storage.bunnycdn.com (US East),
#   la.storage.bunnycdn.com (US West), sg.storage.bunnycdn.com (Singapore)
BUNNY_STORAGE_HOST="storage.bunnycdn.com"

# The Storage Zone name you created
BUNNY_ZONE="live-media"

# The Storage Zone Password (this is the API/FTP password, NOT your account password)
BUNNY_KEY="203077a4-6563-4724-9f64c65e2d4a-7bdf-4ed0"

# Subfolder inside the zone to store recordings (no leading slash)
REMOTE_PATH="recordings"

# Local recordings directory (matches the recorder)
REC_DIR="/opt/owncast/recordings"

# Only upload files that haven't been modified in this many seconds
# (ensures the recording is finished, not still being written).
SETTLE_SECONDS=120
